function closePause() {
  if (!window._paused) return;
  window._paused = false;
  document.querySelectorAll(".game .pausemenu, .game .confirm, .game .settings-ov").forEach(e => e.remove());
  document.querySelector(".game").classList.remove("paused");
  gameResume();
  try { if (Sfx.ctx) Sfx.ctx.resume(); } catch (e) {}
  try { speechSynthesis.resume(); } catch (e) {}
  try { if (narAudio) narAudio.play(); } catch (e) {}
  try { const ep = $("epilogueAudio"); if (ep && ep.currentTime > 0 && !ep.ended) ep.play(); } catch (e) {}
}

addEventListener("keydown", e => {
  const k = e.code;
  if (k === "Escape") {
    e.preventDefault();
    const cf = document.querySelector(".game .confirm");
    if (cf) { cf.querySelector("#cN").click(); return; }
    const st = document.querySelector(".game .settings-ov");
    if (st) { st.remove(); return; }
    if (window._paused) { closePause(); return; }
    const top = document.querySelector(".game .ov.menu");
    if (top) return;
    openPause();
    return;
  }
  if (["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) {
    if (!document.querySelector(".game .ov")) e.preventDefault();
    Walk.keys[k] = 1;
    return;
  }
  if (k === "KeyE" && !e.repeat) Walk.interact();
});
addEventListener("keyup", e => { delete Walk.keys[e.code]; });
addEventListener("blur", () => { Walk.keys = {}; });
document.addEventListener("visibilitychange", () => { if (document.hidden) openPause(); });

(function startLoop() {
  let last = performance.now();
  const loop = now => {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    try { Walk.tick(dt); } catch (e) {}
  };
  requestAnimationFrame(loop);
})();

function quitGame() {
  askConfirm("Выйти из игры?", "Несохранённый прогресс будет потерян. Сохранённые главы останутся.", () => {
    try { narStop(); stopDispatcherVoice(); stopCutVoice(); Sfx.heartbeatStop(); } catch (e) {}
    try { if (window.electronAPI && window.electronAPI.quit) window.electronAPI.quit(); } catch (e) {}
    try { window.close(); } catch (e) {}
    setTimeout(() => {

let dispatcherCooldown = false;
function openDispatcherDialog() {
  if (!panelNear()) return;
  if (window._locked || window._dispOpen) return;
  const isTask = window._currentSceneId === "up_stuck";
  if (!isTask && dispatcherCooldown) return;
  window._dispOpen = true;
  narStop();
  dispatcherCooldown = true;
  setTimeout(() => { dispatcherCooldown = false; }, 9000);

  let typedDone = false;
  let voiceDone = false;
  let ended = false;
  const tryFinish = () => {
    if (ended || !typedDone || !voiceDone) return;
    if (window._currentSceneId !== "up_stuck") return;
    ended = true;
    setTimeout(() => {
      closeDialogRef();
      go("up_arrived");
    }, 700);
  };
  let closeDialogRef = () => {};
  Sfx.dispatchSound();
  playDispatcherVoice(() => {
    voiceDone = true;
    tryFinish();
  });
  setTimeout(() => {
    voiceDone = true;
    tryFinish();
  }, 30000);

  const ov = document.createElement("div");
  ov.className = "ov";
  const fullText = "Здравствуйте, это автоответчик. К сожалению, вы находитесь в другом мире, и мы к вам не пр-р-и-и-е-е-й-й-е-е-д-д-е-е-м...";

  ov.innerHTML = `
    <div class="pw" style="cursor:default;">
      <div class="pp2" style="font-size: 1.4rem; max-width: 600px; text-align: left; padding: 24px;">
        <div style="font-weight:bold; margin-bottom: 8px; color: #ffb4b4;">📞 Диспетчерская служба:</div>
        <span id="dispTyped"></span>
      </div>
    </div>
    ${isTask ? "" : '<button class="ovb" id="closeDispBtn">Положить трубку</button>'}
  `;
  document.querySelector(".game").appendChild(ov);

  let charIndex = 0;
  const typedEl = $("dispTyped");
  const typeInterval = setInterval(() => {
    if (charIndex < fullText.length) {
      typedEl.textContent += fullText.charAt(charIndex);
      charIndex++;
    } else {
      clearInterval(typeInterval);
      typedDone = true;
      tryFinish();
    }
  }, 45);

  const closeDialog = () => {
    clearInterval(typeInterval);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    stopDispatcherVoice();
    ov.remove();
    window._dispOpen = false;
    window._dispCleanup = null;
  };
  closeDialogRef = closeDialog;
  window._dispCleanup = closeDialog;

  if (!isTask) {
    $("closeDispBtn").onclick = closeDialog;
    ov.onclick = e => {
      if (e.target === ov) closeDialog();
    };
  }
}

function closeDoorsThen(fn, ms) {
  let need = false;
  document.querySelectorAll(".art .door-left, .art .door-right").forEach(e => {

    if (/(^|\s)(open|anim-open)(\s|$)/.test(c)) {
      need = true;
      e.setAttribute("class", c.replace(/\s*(anim-open|anim-close-from-open|anim-close|open)(?=\s|$)/g, "") + " anim-close-from-open");
    }
  });
  if (need) {
    Sfx.click();
    qteTimer = setTimeout(fn, ms || 700);
  } else {

  }
}

function smsBeep() {
  if (!soundOn || soundVolume <= 0) return;
  try {
    Sfx.initCtx();
    const c = Sfx.ctx, t = c.currentTime;
    [[880, 0], [1175, 0.14]].forEach(([f, d]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.16 * soundVolume, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
      o.connect(g);
      g.connect(c.destination);
      o.start(t + d);
      o.stop(t + d + 0.25);
    });
  } catch (e) {}
}

function startElevatorRide(targetFloor, startFloor, nextScene, s) {
  s = s || {};
  let currentFloor = startFloor || 1;
  const disp = $("disp");
  const hudt = $("hudt");
  const artEl = $("art");
  const stepMs = 1200;
  const direction = targetFloor > currentFloor ? 1 : -1;

  const begin = () => {
    artEl.innerHTML = art("up_moving", currentFloor);
    const cd = artEl.querySelector(".cab-disp");
    if (cd) cd.textContent = currentFloor;
    rideTimer = setInterval(() => {
      currentFloor += direction;
      disp.textContent = currentFloor;
      const cabDisp = artEl.querySelector(".cab-disp");
      if (cabDisp) cabDisp.textContent = currentFloor;
      artEl.querySelectorAll("[class^='btn-node-']").forEach(el => {
        el.setAttribute("fill", "#3a3d43");
        el.removeAttribute("class");
      });
      const activeBtn = artEl.querySelector(`.btn-node-${currentFloor}`);
      if (activeBtn) {
        activeBtn.setAttribute("fill", "#e62929");
        activeBtn.setAttribute("class", "blink-btn");
      }
      hudt.textContent = currentFloor > 9 || currentFloor === 7 ? "аномальная зона" : "лифт";
      if (currentFloor === targetFloor) {
        clearInterval(rideTimer);
        rideTimer = null;
        disp.classList.remove("red");
        show(nextScene);
      }
    }, stepMs);
  };

  if (s.closeArt) {
    qteTimer = setTimeout(() => closeDoorsThen(() => { qteTimer = setTimeout(begin, 300); }, 650), 500);
  } else {
    qteTimer = setTimeout(begin, (s.fingerDelay && window._fingers) ? s.fingerDelay : (s.delay || 600));
  }
}

      btn.dataset.busy = "1";
      Sfx.click();
      const target = s.c[0][1];
      try { paperEl.getAnimations().forEach(a => a.cancel()); } catch (e) {}
      noteAnimating = false;
      if (noteStateExpanded) {
        noteStateExpanded = false;
        animateNote(paperEl, false);
        setTimeout(() => go(target), 650);
      } else {
        go(target);
      }
    };
    ov.appendChild(btn);
    document.querySelector(".game").appendChild(ov);
  }

  if (id === "inlift") showPhoneSms();
  if (s.auto) qteTimer = setTimeout(() => go(s.auto.next), s.auto.ms);
  if (s.ride) startElevatorRide(s.target, s.startFloor || 1, s.next, s);
  if (s.timer && !s.closeNext) qteTimer = setTimeout(() => go(s.timer.next), s.timer.sec * 1000);
  if (s.timer && s.closeNext) {
    qteTimer = setTimeout(() => {
      if (window._currentSceneId !== id || window._closing) return;
      window._closing = true;
      closeDoorsThen(() => {
        window._closing = false;
        go(s.timer.next);
      }, 700);
    }, s.timer.sec * 1000);
  }
  if (s.qte) {
    qteEnd = performance.now() + s.qte.sec * 1000;
    qteTimer = setTimeout(() => go(s.qte.fail), s.qte.sec * 1000);
  }
}

function go(n) {
  if (n === "call" && window._currentSceneId === "call") return;
  if (n === "menu") {
    Sfx.click();
    showTitle();
    return;
  }
  if (E[n]) {
    clearTimeout(qteTimer);
    clearInterval(rideTimer);
    Sfx.heartbeatStop();
    $("actionDoorBtn").style.display = "none";
    narStop();
    Walk.hide();

    const scareMs = DeathScream.trigger(DeathScream.kind(n));

    const d = $("disp");
    d.className = "disp red";
    d.textContent = "×";
    const a = $("art");
    a.className = "art";
    a.innerHTML = "";
    setTimeout(() => {
      if (window._currentSceneId !== n) return;
      a.innerHTML = art(n, 1);
      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");
    }, scareMs);
    $("scene").innerHTML = "";
    $("choices").innerHTML = "";

    const delay = ({ e_hatch: 8400, e_dad: 8400, e_f2_wrong: 7200, e_mom: 9300, e_late: 6600, e_f2_out: 7200, e_66: 7400 })[n] || 0;
    document.querySelectorAll(".game .ov, .game .cutc").forEach(e => e.remove());
    dispReset();
    window._currentSceneId = n;
    setLock(delay + scareMs);

    if (n === "e_hatch" || n === "e_dad") qteTimer = setTimeout(() => a.classList.add("glitch"), 7000 + scareMs);

    const fin = () => {
      narrate(n, String(E[n]).replace(/67/g, window._doorNum || 67));
      $("scene").innerHTML = "<p class='end'>" + String(E[n]).replace(/67/g, window._doorNum || 67) + "</p>";
      $("choices").innerHTML = "<button id='r'>Заново</button><button id='m'>В меню</button>";
      $("r").onclick = () => { Sfx.click(); show("start"); };
      $("m").onclick = () => { Sfx.click(); showTitle(); };
    };

    setTimeout(fin, delay + scareMs);
    return;
  }
  show(n);
}

  const faceKnife = kt =>

  const finale = t0 =>

      ),
      "transform-origin:50% 100%;animation:xIn .05s " + t0 + "s both,camFall 1.5s " + (t0 + 1.2) + "s ease-in both"
    );

  const momFig = (cx, c1, c2) =>
    `<ellipse cx="${cx}" cy="150" rx="11" ry="2.5" fill="#000" opacity="0.4"/>` +
    `<path d="M${cx - 10} 150 L${cx - 7} 112 Q${cx} 104 ${cx + 7} 112 L${cx + 10} 150Z" fill="${c1}"/>` +

    `<path d="M${cx - 7} 100Q${cx} 92 ${cx + 7} 100" fill="#6b4a32"/>` +
    `<circle cx="${cx - 2.6}" cy="102" r=".9" fill="#222"/><circle cx="${cx + 2.6}" cy="102" r=".9" fill="#222"/>` +
    `<path d="M${cx - 2} 106Q${cx} 108 ${cx + 2} 106" stroke="#a5503a" fill="none" stroke-width=".8"/>` +
    `<rect x="${cx - 12}" y="122" width="24" height="3" rx="1.5" fill="#f1ede2"/>` +
    `<ellipse cx="${cx - 8}" cy="120" rx="4" ry="2.4" fill="#c98a4a"/>` +
    `<ellipse cx="${cx}" cy="119" rx="4" ry="2.4" fill="#d79a58"/>` +
    `<ellipse cx="${cx + 8}" cy="120" rx="4" ry="2.4" fill="#c98a4a"/>`;

  const eye = (cx, cy, rx, ry, ir, cls = "", st = "") =>
    `<g class="ey ${cls}" style="${st}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#eee6dc"/><path d="M${cx - rx} ${cy}Q${cx - rx * 0.5} ${cy - ry * 0.4} ${cx - rx * 0.7} ${cy - ry * 0.8}M${cx + rx} ${cy}Q${cx + rx * 0.55} ${cy + ry * 0.3} ${cx + rx * 0.7} ${cy + ry * 0.75}" stroke="#b01818" stroke-width="${Math.max(0.4, rx / 40)}" fill="none" opacity=".7"/><circle cx="${cx}" cy="${cy}" r="${ir}" fill="#6b1d1d"/><circle class="pup" cx="${cx}" cy="${cy}" r="${ir * 0.5}" fill="#000"/><circle cx="${cx - ir * 0.3}" cy="${cy - ir * 0.3}" r="${ir * 0.14}" fill="#fff" opacity=".8"/></g>`;

  const voidFall = () => {
    const st = [];
    const deb = [];
    for (let i = 0; i < 16; i++) {

      deb.join("") +
      `<g class="dropscene"><g transform="translate(-205.7 -196.6) scale(2.286)">${floor2Art(false, "#a81818", true)}</g><ellipse class="voidgrow" cx="160" cy="168" rx="46" ry="12" fill="#000" stroke="#300" stroke-width="1.5"/></g>`

  const stairs = done => {

    for (let i = 0; i < 8; i++) {

    h +=

      R(296, 22, 18, 22, "#0e0f11") +
      T(305, 39, 14, "#f4f1ea", "7") +
      '<path d="M130 112L290 24" stroke="#8b8a85" stroke-width="1.5" fill="none"/>';
    const fg = `<g transform="scale(.62) translate(0 -172)">${figureSide3d(0)}</g>`;
    return h + (done ? `<g transform="translate(286 64)">${fg}</g>` : `<g class="stairwalk"><g class="cutwalk">${fg}</g></g>`);
  };

  const A = {
    board_wait: () => svg(cab("closed", "", "10", 1, 7) + man("idle")),
    up_stuck: () => svg(cab("closed", "", "10", 1, 0) + man("idle")),
    back: () => svg(cab("open", R(90, 56, 140, 112, "#0b0c0e") + fl("#17191d"), "10", 0, 0) + man("walk")),
    cl_f10: () => svg(cab("open", R(90, 56, 140, 112, "#0b0c0e") + fl("#17191d") + paperGfx, "10", 0, 0) + man("idle")),
    cl_f2r: () => svg(cab("open", floor2Art(true, "#d97326", false), "2", 0, 2) + man("idle")),
    inlift: () => svg(cab("open", R(90, 56, 140, 112, "#b9b5a8") + fl("#7c786d"), "1", 0, 0) + man("idle")),
    call: () => {
      const lit = A.start().replace(/onclick="Sfx.click\(\);go\('call'\)"/, "").replace("pulse-call", "");
      const dn = (x, c, d) => `<g><rect x="${x}" y="48" width="40" height="104" fill="${c}"/><animateTransform attributeName="transform" type="translate" from="0 0" to="${d} 0" dur="1s" begin="1.2s" fill="freeze"/></g>`;
      return lit.replace(
        "</svg>",
        '<defs><clipPath id="lcp"><rect x="170" y="48" width="80" height="104"/></clipPath></defs><circle cx="152" cy="96" r="4.5" fill="#ffcf6a"/><rect x="170" y="48" width="80" height="104" fill="#2a2e34"/><rect x="170" y="48" width="80" height="12" fill="#1c1f24"/><rect x="190" y="50" width="40" height="3" rx="1.5" fill="#f4e9c0"/><polygon points="170,48 182,60 182,140 170,152" fill="#22252a"/><polygon points="250,48 238,60 238,140 250,152" fill="#22252a"/><rect x="182" y="60" width="56" height="80" fill="#3b4048"/><rect x="170" y="140" width="80" height="12" fill="#55595f"/><rect x="182" y="104" width="56" height="2.5" fill="#8b8a85"/><g clip-path="url(#lcp)">' + dn(170, "#4a4e55", -40) + dn(210, "#3f434a", 40) + "</g></svg>"
      );
    },
    paper: () => A.note(),
    pickup: () => svg(cab("open", R(90, 56, 140, 112, "#0b0c0e") + fl("#17191d") + paperGfx, "10", 0, 0) + man("note")),
    floor2_real: () => svg(cab("anim-open", floor2Art(true, "#d97326", false), "2", 0, 2) + man("idle")),
    floor2_blood: () => svg(cab("anim-open", floor2Art(false, "#a81818", true, true), "2", 1, 2) + man("trem")),
    floor2_check: () => svg(cab("closed", floor2Art(false, "#a81818", true), "2", 1, 2) + man("trem")),
    floor9_intro: () => svg(cab("anim-open", floor9Art(), "9", 1, 9) + man("trem")),
    out: () => svg(cab("open", redWall() + R(205, 92, 22, 56, "#f2b36a", 'class="glow"'), "7", 1, 0) + man("away")),
    creature: () => svg(cab("open", redWall() + R(145, 74, 80, 94, "#4a0f0f", 'class="glow"') + '<g class="approach" style="animation-duration:' + S.creature.qte.sec + 's">' + fig + "</g>", "7", 1, 0) + man("runin")),
    slam: () =>
      svg(
        cab("closed", "", "7", 1, 0) +
        (window._fingers
          ? `<g class="fstuck">${[0, 1, 2, 3].map(i => R(152 + i * 4.4, 98 + (i % 2) * 4, 3.4, 24, "#d8cfc4", 'rx="1.7"')).join("")}</g><g class="fblood">${R(156, 122, 2, 14, "#a00", 'rx="1"')}${R(163, 126, 2, 20, "#a00", 'rx="1"')}${R(170, 120, 2, 12, "#a00", 'rx="1"')}</g>`
          : "") +
        man("idle")
      ),
    start: () =>
      svg(
        R(0, 0, 320, 180, "#1a1d21") +
        R(0, 150, 320, 30, "#2a2d32") +
        `<path d="M0 150 L320 150" stroke="#000" stroke-opacity="0.45" stroke-width="1.5"/>` +
        R(130, 8, 60, 5, "#f4e9c0", 'rx="2.5" class="lamp"') +
        R(20, 40, 70, 110, "#3a2f26", 'rx="2"') +
        R(32, 52, 46, 34, "#10161c") +
        '<g class="sway">' + R(27, 92, 56, 30, "#f1ede2") + T(55, 104, 11, "#222", "ОБЕД") + T(55, 116, 8, "#222", "15 минут") + "</g>" +
        R(166, 40, 88, 112, "#22252a") +
        R(192, 22, 36, 16, "#08090a", 'rx="3"') +
        T(210, 36, 16, "#f4f1ea", "▼") +
        R(170, 48, 80, 104, "#e6dcb8") +
        R(170, 48, 40, 104, "#4a4e55") +
        R(210, 48, 40, 104, "#3f434a") +
        R(146, 88, 12, 26, "#191b1f", 'rx="3"') +
        '<g class="hotspot" onclick="Sfx.click();go(\'call\')"><circle class="pulse-call" cx="152" cy="96" r="4.5" fill="#6b5a2a"/><circle cx="152" cy="96" r="11" fill="transparent"/></g>'
      ),
    up: () => svg(cab("closed", "", "1", 0, 7) + '<g stroke="#8b8a85" stroke-width="2" opacity="0.35"><g class="rise"><path d="M30 130v20M30 170v10M50 120v30M270 130v20M290 120v30M290 170v10"/></g></g>' + man("idle")),
    up_closing: () => svg(cab("anim-close-from-open", "", "1", 0, 7) + '<g stroke="#8b8a85" stroke-width="2" opacity="0.35"><g class="rise"><path d="M30 130v20M30 170v10M50 120v30M270 130v20M290 120v30M290 170v10"/></g></g>' + man("idle")),
    up_moving: () => svg(cab("closed", "", "1", 0, 7) + '<g stroke="#8b8a85" stroke-width="2" opacity="0.35"><g class="rise"><path d="M30 130v20M30 170v10M50 120v30M270 130v20M290 120v30M290 170v10"/></g></g>' + man("idle")),
    up_arrived: () => svg(cab("anim-open", R(90, 56, 140, 112, "#0b0c0e") + fl("#17191d") + paperGfx, "10", 0, 0) + man("idle")),
    note: () => svg(cab("open", R(90, 56, 140, 112, "#0b0c0e") + fl("#17191d") + paperGfx, "10", 0, 0) + man("idle")),
    seven: () => svg(cab("anim-open", redWall() + R(205, 92, 22, 56, "#f2b36a", 'class="glow"') + '<circle cx="216" cy="100" r="5" fill="#1a0a0a"/>' + R(211, 105, 10, 38, "#1a0a0a", 'rx="4"'), "7", 1, 0) + man("trem")),
    end2: () => svg(cab("anim-close-from-open", R(90, 56, 140, 112, "#c9c5b8") + fl("#8c887c") + R(150, 122, 70, 28, "#6b5a45") + '<circle cx="185" cy="102" r="11" fill="#3b3330"/>' + R(172, 111, 26, 14, "#3b3330", 'rx="5"') + '<circle cx="181" cy="100" r="2.5" fill="#fff"/><circle cx="190" cy="100" r="2.5" fill="#fff"/><circle cx="185" cy="107" r="2.5" fill="#111"/>', "1", 0, 0)),
    stairs: () => svg(stairs(false)),
    cut: () => svg(R(0, 0, 320, 180, "#000")),
    fin: () => svg(stairs(true)),
    hatch: () => `<div class="tiltwrap"><div class="tiltpane">${svg(cab("closed", "", "1", 0, 0) + man("look"))}</div><div class="tiltpane up">${hatch(0, "«Открой! Это я!»", true)}</div></div>`,
    dog: () => hatch(1, "«Бобик! Открывай!»", true),
    dad_proof: () => hatch(1, "«Это же я, твой отец!»", true),
    dad_trip: () => hatch(1, "«Я ездил в командировку!»", true),
    break: () => hatch(2, "ОТКРЫВАЙ"),
    end: () => svg(cab("anim-open", R(90, 56, 140, 112, "#c9c5b8") + fl("#8c887c") + R(150, 122, 70, 28, "#6b5a45") + '<circle cx="185" cy="102" r="11" fill="#3b3330"/>' + R(172, 111, 26, 14, "#3b3330", 'rx="5"') + '<circle cx="181" cy="100" r="2.5" fill="#fff"/><circle cx="190" cy="100" r="2.5" fill="#fff"/><circle cx="185" cy="107" r="2.5" fill="#111"/>', "1", 0, 0) + man("away")),
    e_mom: () => {
      const L1 = svg(cab("anim-close", redWall() + R(205, 92, 22, 56, "#f2b36a", 'class="glow"') + `<g class="momwalk"><g class="holo">${momFig(216, "#8b3a3a", "#b84a4a")}<g opacity=".3" transform="translate(1.5 0)">${momFig(216, "#5ff", "#5ff")}</g></g></g>`, "7", 1, 0) + man("away"));
      const L2 = svg(R(0, 0, 320, 180, "#1a0a0a") + R(0, 140, 320, 40, "#241010") + T(160, 80, 80, "#b30e0e", "7", 'opacity=".45"') + R(40, 0, 4, 70, "#b30e0e", 'rx="2" class="drip"') + R(250, 0, 5, 95, "#b30e0e", 'rx="2" class="drip"') + '<g class="loom"><g transform="translate(160 205) scale(2.4) translate(-185 -152)">' + fig + "</g></g>");
      return lay(L1, "animation:xOut .15s 3.4s forwards", "late") + lay(L2, "animation:xIn .15s 3.4s both,xOut .15s 5.4s forwards") + lay(faceKnife(5.6), "animation:xIn .15s 5.4s both,xOut .05s 6.6s forwards") + finale(6.6);
    },
    e_hatch: () => {
      const L1 = svg(R(0, 0, 320, 180, "#0c0d0f") + '<polygon points="10,180 310,180 250,0 70,0" fill="#14161a"/>' + R(125, 36, 70, 70, "#000") + `<g transform="rotate(-70 125 106)">${R(125, 36, 70, 70, "#2a2d32", 'stroke="#5b5f66" stroke-width="3"')}</g>` + `<g transform="translate(-25 -40)"><g class="descend">${fig}</g></g>`);
      const L2 = svg(cab("closed", "", "1", 1, 0) + `<g class="loom" style="animation-delay:2.4s"><g transform="translate(160 190) scale(1.7) translate(-185 -152)">${fig}</g></g>` + man("fall2"));
      const L3 = svg(R(0, 0, 320, 180, "#050304") + '<ellipse cx="160" cy="95" rx="120" ry="100" fill="#3a1010" opacity=".55"/><ellipse cx="160" cy="92" rx="62" ry="80" fill="#000"/><circle cx="138" cy="78" r="7" fill="#fff"/><circle cx="182" cy="78" r="7" fill="#fff"/><path d="M126 118Q160 152 194 118" stroke="#fff" stroke-width="3" fill="none"/><g class="knife" style="animation-delay:5.7s"><g transform="rotate(14 250 180)"><polygon points="240,150 262,150 256,40" fill="#d6dce2"/><rect x="240" y="150" width="22" height="40" fill="#2b1d12"/></g></g>');
      const L4 = svg('<rect width="320" height="180" fill="#5a0505" opacity="0" style="animation:xIn .5s 6.6s forwards"/>' + [0, 1, 2, 3].map(i => `<rect class="slashK" style="animation-delay:${6.3 + i * 0.07}s" x="-20" y="${-10 + i * 48}" width="380" height="46" fill="#9a0b0b" transform="skewY(-10)"/>`).join("") + '<rect width="320" height="180" fill="#fff" class="flash2" style="animation-delay:6.3s"/>');
      return lay(L1, "animation:hitShake .35s 1.45s,xOut .15s 2.4s forwards") + lay(L2, "animation:xIn .15s 2.4s both,xOut .15s 4.2s forwards") + lay(L3, "animation:xIn .15s 4.2s both,xOut .05s 6.3s forwards") + lay(L4, "animation:xIn .05s 6.3s both");
    },
    e_late: () => {
      const L1 = svg(cab("open", R(90, 56, 140, 112, "#1a0808") + fl("#240c0c") + '<g class="approach" style="animation-duration:2.2s">' + fig + "</g>", "7", 1, 0) + man("trem"));
      return lay(L1, "animation:xOut .15s 2.2s forwards") + lay(faceKnife(3.0), "animation:xIn .15s 2.2s both,xOut .05s 3.6s forwards") + finale(3.6);
    },
    e_f2_out: () => voidFall(),
    e_f2_wrong: () => voidFall(),
    e_66: () => {
      const L1 = svg(cab("open", floor9Art(), "9", 1, 9) + '<g class="eyesApp">' + eye(156, 108, 7, 4, 2.6) + eye(172, 108, 7, 4, 2.6) + "</g>");
      const sm = [[40, 40], [270, 36], [60, 140], [250, 150], [160, 20], [20, 95], [300, 100], [110, 165], [205, 28]].map((q, i) => eye(q[0], q[1], 14, 8, 5, "sprout", `animation-delay:${2.8 + i * 0.22}s`)).join("");
      const L2 = svg(R(0, 0, 320, 180, "#050203") + '<g class="bigeye">' + eye(108, 90, 62, 40, 26) + eye(212, 90, 62, 40, 26) + "</g>" + sm);
      const L3 = svg(R(0, 0, 320, 180, "#120618") + '<circle cx="160" cy="90" r="85" fill="#4b0f3a" opacity=".7"/><circle cx="160" cy="90" r="55" fill="#a81d1d" opacity=".8"/><circle cx="160" cy="90" r="24" fill="#fff"/>' + eye(160, 90, 44, 28, 18) + '<ellipse class="voidbloom" cx="160" cy="90" rx="14" ry="14" fill="#000"/>');
      return lay(L1, "animation:xOut .15s 2.4s forwards") + lay(L2, "animation:xIn .15s 2.4s both,xOut .15s 5s forwards") + lay(L3, "animation:xIn .15s 5s both,halluFx 1.8s 5s linear both");
    },
    e_f2_wrong_old: () => voidFall(),
    e_f2_out_old: () => voidFall()
  };

  return (A[id === "e_dad" ? "e_hatch" : id] || A.start)();
}

  document.head.appendChild(st);

  const SAVE_KEY = "kcSaveData_v2";
  const SAVE_DEFAULT = { ch1Done: false, ch2Done: false, ch2Stage: null };
  const SAVE_DIR = "сохранение";
  const SAVE_FILE = "save.json";

  const Store = {
    mode: window.kcNative ? "native" : (/^https?:$/.test(location.protocol) ? "server" : ((typeof window.showDirectoryPicker === "function") ? "fs" : "ls")),
    cache: Object.assign({}, SAVE_DEFAULT),
    root: null,
    dir: null,
    state: "none",   // none | need-perm | ready
    err: "",
    onChange: null,

    changed() { try { if (this.onChange) this.onChange(); } catch (e) {} },

    idb() {
      return new Promise((res, rej) => {
        const r = indexedDB.open("kcStore", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("h");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async idbGet(k) {
      const db = await this.idb();
      return new Promise((res, rej) => {
        const q = db.transaction("h").objectStore("h").get(k);
        q.onsuccess = () => res(q.result);
        q.onerror = () => rej(q.error);
      });
    },
    async idbSet(k, v) {
      const db = await this.idb();
      return new Promise((res, rej) => {
        const tx = db.transaction("h", "readwrite");
        tx.objectStore("h").put(v, k);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    },

    mergeIn(d) {
      d = d || {};
      const c = this.cache;
      c.ch1Done = !!(c.ch1Done || d.ch1Done);
      c.ch2Done = !!(c.ch2Done || d.ch2Done);
      c.ch2Stage = c.ch2Stage || d.ch2Stage || null;
    },

    async attach(root) {
      this.root = root;
      this.dir = await root.getDirectoryHandle(SAVE_DIR, { create: true });
      let d = {};
      try {
        const fh = await this.dir.getFileHandle(SAVE_FILE);
        const f = await fh.getFile();
        d = JSON.parse(await f.text());
      } catch (e) {}
      this.mergeIn(d);
      this.state = "ready";
      this.err = "";
      await this.flush();
      this.changed();
    },

    async flush() {
      if (this.mode === "server") {
        // сохранение на сервере по нику (ник задаётся в mp.js)
        if (window.kcNick && window.kcServerPut) {
          try { await window.kcServerPut(window.kcNick, this.cache); } catch (e) {}
        }
        return;
      }
      if (this.mode === "native") {
        try { await window.kcNative.save(JSON.stringify(this.cache, null, 2)); } catch (e) {}
        return;
      }
      if (this.mode === "ls") {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.cache)); } catch (e) {}
        return;
      }
      if (this.state !== "ready" || !this.dir) return;
      try {
        const fh = await this.dir.getFileHandle(SAVE_FILE, { create: true });
        const w = await fh.createWritable();
        await w.write(JSON.stringify(this.cache, null, 2));
        await w.close();
      } catch (e) {
        this.state = "need-perm";
        this.err = "Не удалось записать в папку сохранений";
        this.changed();
      }
    },

    async init() {
      if (this.mode === "server") {
        // данные придут, когда игрок введёт ник: mp.js вызовет kcStoreMerge
        window.kcStoreMerge = d => { this.mergeIn(d); this.changed(); };
        this.state = "ready";
        this.changed();
        return;
      }
      if (this.mode === "native") {
        try { const s = await window.kcNative.load(); if (s) this.mergeIn(JSON.parse(s)); } catch (e) {}
        this.state = "ready";
        this.changed();
        return;
      }
      if (this.mode === "ls") {
        try { this.mergeIn(JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch (e) {}
        this.state = "ready";
        this.changed();
        return;
      }
      try {
        const root = await this.idbGet("root");
        if (root) {
          this.root = root;
          const p = await root.queryPermission({ mode: "readwrite" });
          if (p === "granted") await this.attach(root);
          else this.state = "need-perm";
        }
      } catch (e) {}
      this.changed();
    },

    // вызывать только из клика (нужен жест пользователя)
    async connect() {
      this.err = "";
      try {
        if (this.root) {
          try {
            const p = await this.root.requestPermission({ mode: "readwrite" });
            if (p === "granted") { await this.attach(this.root); return true; }
          } catch (e) {}
        }
        const root = await window.showDirectoryPicker({ mode: "readwrite" });
        try { await this.idbSet("root", root); } catch (e) {}
        await this.attach(root);
        return true;
      } catch (e) {
        if (!e || e.name !== "AbortError") this.err = "Не удалось открыть папку: " + ((e && e.message) || e);
        this.changed();
        return false;
      }
    },

    ready() { return this.mode === "ls" || this.mode === "native" || this.state === "ready"; }
  };

  function loadSave() { return Object.assign({}, Store.cache); }
  function writeSave(patch) {
    Object.assign(Store.cache, patch);

  const ROOM_NAMES = {
    corridor: "Коридор",

  /* ---------- псевдо-3D помощники для комнат ---------- */
  const _st2 = document.createElement("style");
  _st2.textContent = "body.ch2 #wk .bp{display:none}@keyframes pLeave{0%{transform:translateX(0);opacity:1}100%{transform:translateX(34px);opacity:0}}";
  document.head.appendChild(_st2);

  const hx = (c, k) => {
    const n = parseInt(c.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = k < 0 ? 0 : 255, a = Math.abs(k);
    r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  };
  const rc = (x, y, w, h, f, e = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${e}/>`;
  const pg = (p, f, e = "") => `<polygon points="${p}" fill="${f}" ${e}/>`;
  const tx = (x, y, s, f, t, e = "") => `<text x="${x}" y="${y}" font-size="${s}" fill="${f}" text-anchor="middle" font-family="Lora, Georgia, serif" font-weight="600" ${e}>${t}</text>`;
  // объёмный ящик: фронт + верхняя грань + боковая грань к центру комнаты
  const bx = (x, y, w, h, d, c, e = "") => {
    const m = x + w / 2, sg = m < 160 ? 1 : -1, dx = sg * d * 0.4, dy = d * 0.5;
    let s = `<ellipse cx="${m + dx / 2}" cy="${y + h + 1}" rx="${w / 2 + d * 0.35}" ry="3" fill="#000" opacity=".35"/>`;
    s += pg(`${x},${y} ${x + w},${y} ${x + w + dx},${y - dy} ${x + dx},${y - dy}`, hx(c, 0.22));
    s += sg > 0
      ? pg(`${x + w},${y} ${x + w + dx},${y - dy} ${x + w + dx},${y - dy + h} ${x + w},${y + h}`, hx(c, -0.35))
      : pg(`${x},${y} ${x + dx},${y - dy} ${x + dx},${y - dy + h} ${x},${y + h}`, hx(c, -0.35));
    s += rc(x, y, w, h, c, `stroke="${hx(c, -0.5)}" stroke-width=".6" ${e}`) + rc(x, y, w, 1.2, hx(c, 0.3), 'opacity=".6"') + rc(x, y + h - 2, w, 2, "#000", 'opacity=".25"');
    return s;
  };

  const shell = o => {
    const W = o.wall, F = o.floor;
    let s = rc(0, 0, 320, 180, "#0b0c0f");
    s += pg("0,0 320,0 270,28 50,28", hx(W, -0.5));
    s += pg("0,0 50,28 50,132 0,180", hx(W, -0.22)) + pg("320,0 270,28 270,132 320,180", hx(W, -0.32));
    s += rc(50, 28, 220, 104, W);
    if (o.pat === "stripes") {
      for (let x = 60; x < 270; x += 12) s += rc(x, 28, 5, 104, "#000", 'opacity=".08"');
      for (let x = 6; x < 50; x += 10) {
        const t = x * 0.56, bt = 180 - x * 0.96;
        s += `<rect x="${x}" y="${t}" width="4" height="${bt - t}" fill="#000" opacity=".08"/><rect x="${316 - x}" y="${t}" width="4" height="${bt - t}" fill="#000" opacity=".08"/>`;
      }
    }
    if (o.pat === "paper") {
      for (let y = 34; y < 130; y += 14) for (let x = 58 + ((y / 14) % 2) * 10; x < 268; x += 20) s += `<circle cx="${x}" cy="${y}" r="1.6" fill="#000" opacity=".1"/>`;
    }
    if (o.pat === "tile") {
      for (let y = 28; y < 132; y += 13) s += rc(50, y, 220, 0.7, "#000", 'opacity=".22"');
      for (let x = 50; x < 270; x += 13) s += rc(x, 28, 0.7, 104, "#000", 'opacity=".22"');
      for (let f = 0.06; f < 1; f += 0.13) s += `<path d="M0 ${f * 180} L50 ${28 + f * 104} M320 ${f * 180} L270 ${28 + f * 104}" stroke="#000" stroke-opacity=".22" stroke-width=".7"/>`;
    }
    s += '<clipPath id="cF"><polygon points="0,180 50,132 270,132 320,180"/></clipPath>';
    s += pg("0,180 50,132 270,132 320,180", F);
    s += '<g clip-path="url(#cF)">';
    for (let i = -8; i <= 18; i++) { const t0 = 50 + i * 22; s += `<path d="M${t0} 132 L${160 + (t0 - 160) * 2.2} 180" stroke="#000" stroke-opacity="${o.fl === "tile" ? 0.3 : 0.22}" stroke-width=".7"/>`; }
    [137, 144, 154, 168].forEach((y, i) => { s += rc(0, y, 320, 0.7, "#000", 'opacity=".25"'); });
    if (o.fl === "tile") for (let i = 0; i < 22; i++) { const t0 = 50 + i * 22, y = [132, 137, 144, 154, 168, 180]; for (let j = 0; j < 5; j++) if ((i + j) % 2) s += pg(`${t0},${y[j]} ${t0 + 22},${y[j]} ${t0 + 22},${y[j + 1]} ${t0},${y[j + 1]}`, "#000", 'opacity=".08"'); }
    s += "</g>";
    const bc = hx(o.base || W, -0.45);
    s += rc(50, 125, 220, 7, bc) + pg("0,172 50,125 50,132 0,180", bc) + pg("320,172 270,125 270,132 320,180", bc);
    s += rc(49.4, 28, 1.2, 104, "#000", 'opacity=".35"') + rc(269.4, 28, 1.2, 104, "#000", 'opacity=".35"');
    s += rc(0, 0, 320, 180, "url(#gW)") + rc(0, 0, 320, 180, "url(#gL)");
    return s;
  };

  const isOpen = id => !!id && (Ch2.room !== "corridor" || Ch2.doorOpen(id));
  const bdoor = (x, w, c, id) => {
    const o = isOpen(id);
    let s = rc(x - 3, 58, w + 6, 74, hx(c, -0.5));
    if (o) {
      s += rc(x, 61, w, 71, "#120e0a") + rc(x, 61, w, 71, "url(#gL)", 'opacity=".35"') +
        pg(`${x},61 ${x + w * 0.28},65 ${x + w * 0.28},129 ${x},132`, hx(c, -0.15), 'stroke="#000" stroke-opacity=".4" stroke-width=".6"') +
        `<circle cx="${x + w * 0.24}" cy="98" r="1.4" fill="#d8c27a"/>`;
    } else {
      s += rc(x, 61, w, 71, c, 'stroke="#000" stroke-opacity=".35" stroke-width=".6"') +
        rc(x + 4, 65, w - 8, 25, hx(c, 0.1), 'stroke="#000" stroke-opacity=".3" stroke-width=".5"') +
        rc(x + 4, 95, w - 8, 30, hx(c, 0.1), 'stroke="#000" stroke-opacity=".3" stroke-width=".5"') +
        `<circle cx="${x + w - 5}" cy="98" r="1.8" fill="#d8c27a"/>` + rc(x, 61, w, 3, "#000", 'opacity=".25"');
    }
    return id ? `<g data-door="${id}" style="cursor:pointer;pointer-events:all">${s}</g>` : s;
  };

  const sdoor = (x0, x1, c, r, id) => {
    const T = x => x * 0.56, B = x => 180 - x * 0.96, top = x => T(x) + (B(x) - T(x)) * 0.2, m = x => (r ? 320 - x : x);

          f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 3;

          g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.06);
          o.connect(f); f.connect(g); g.connect(c.destination);
          o.start(t + off); o.stop(t + off + 0.07);
        });
      } catch (e) {}
    },

    sfxMimicVoice(text, isMom = true) {
      return;
      if (!soundOn || soundVolume <= 0 || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "ru-RU";
        const voices = window.speechSynthesis.getVoices();
        const v = isMom
          ? voices.find(x => /^ru/i.test(x.lang) && /(irina|svetlana|female|elena|milena)/i.test(x.name))
          : voices.find(x => /^ru/i.test(x.lang) && /(pavel|yuri|dmitri|maxim|male)/i.test(x.name));
        if (v) u.voice = v;
        u.pitch = isMom ? 1.25 : 0.55;
        u.rate = 0.78;
        u.volume = Math.min(1, soundVolume * 1.2);
        window.speechSynthesis.speak(u);
      } catch (e) {}
    },

    start(phase = "intro") {
      this.stopAll();
      document.querySelectorAll(".game .ov, .game .cutc").forEach(e => e.remove());
      dispReset();
      narStop();
      setLock(0);

      this.active = true;
      this.phase = phase;
      this.hiding = null;
      this.poltergeistItems = false;
      this.doors = {};
      this.found = {};
      this.doorsOpen = { living: true, kitchen: true, bedroom: true, bathroom: true };

      $("hud").style.display = "flex";
      $("actionDoorBtn").style.display = "none";
      $("menuBtn").style.display = "flex";
      window._currentSceneId = "ch2_" + phase;

      if (phase === "intro") {
        this.step = "mom_greet";
        this.enterRoom("corridor", 234, 160);
        this.setTime("14:41", false);
        Walk.setTask("Пройди на кухню и поешь суп вместе с родителями", false);
        this.say(
          "<p>Ты закрываешь за собой входную дверь квартиры. После жуткого лифта дома тепло и пахнет бульоном. С кухни слышно, как звякают ложечки о стаканы.</p><p class='good'>Мама и папа сидят за столом и пьют чай. Мама окликает: «О, вернулся! Я куриный суп сварила, иди на кухню».</p>",
          [["Идти на кухню к супу", () => this.enterRoom("kitchen", 160, 164)]]
        );
      } else if (phase.startsWith("loop")) {
        const num = parseInt(phase.replace("loop", ""), 10) || 1;
        this.setupLoop(num);
      } else if (phase === "hunt") {
        this.startHunt();
      } else if (phase === "epilogue") {
        this.startEpilogue();
      }
    },

    setupLoop(n) {
      this.phase = "loop" + n;
      this.step = "need_pc";
      this.hiding = null;
      writeSave({ ch2Stage: this.phase });
      this.enterRoom("bedroom", 160, 164);
      this.setTime("19:41", n >= 2);
      this.doorsOpen = { living: true, kitchen: true, bedroom: true, bathroom: true };
      this.poltergeistItems = n >= 3;

      clearInterval(this.flickerTimer);
      clearInterval(this.voiceTimer);
      clearInterval(this.eventTimer);
      if (n <= 3) {
        this.eventTimer = setInterval(() => {
          if (!this.active || this.phase !== "loop" + n || window._paused || this.hiding || document.querySelector(".game .ov")) return;
          if (Math.random() > 0.22 + n * 0.06) return;
          const list = LOOP_EVENTS[n];
          this.sfxKnock(n >= 3);
          this.say("<p class='" + (n >= 3 ? "blood" : "voice") + "'>" + list[Math.floor(Math.random() * list.length)] + "</p>");
          if (n >= 2 && Math.random() < 0.55) {
            this.shadowUntil = Date.now() + 1300;
            this.renderRoom();
            setTimeout(() => { if (this.active) this.renderRoom(); }, 1400);
          }
        }, 5000);
      }

      if (n === 1) {
        Sfx.heartbeatStop();
        this.loopTask();
        this.say("<p>Ты просыпаешься в своей кровати. На часах снова <b>19:41</b>. В квартире тихо. Надо посидеть за компом перед сном.</p>");
      } else if (n === 2) {
        Sfx.heartbeatStart();
        this.loopTask();
        this.say("<p>Ты резко открываешь глаза. На часах опять <b>19:41</b>. Из коридора, из-за закрытой входной двери, доносится приглушённый шёпот...</p>");
        this.voiceTimer = setInterval(() => {
          if (!this.active || this.phase !== "loop2" || window._paused) return;
          const phrases = [
            ["«Сынок, открой дверь... мы ключи забыли...»", true],
            ["«Эй, открой, это папа! Ну же, открой!»", false],
            ["«Пирожки остывают, сынок, открой...»", true]
          ];
          const pick = phrases[Math.floor(Math.random() * phrases.length)];
          this.sfxKnock(false);
          if (this.room === "corridor") {
            this.say(`<p class='voice'>Из-за входной двери (голосом родителей): ${pick[0]}</p><p>Дверь заперта на замок. Ни в коем случае не открывай.</p>`);
          }
        }, 7500);
      } else if (n === 3) {
        Sfx.heartbeatStart();
        this.loopTask();
        this.say("<p class='blood'>Снова 19:41. Лампочки в квартире начинают бешено мигать, на кухне с грохотом падает посуда, двери комнат сами распахиваются!</p>");
        this.sfxKnock(false);
        this.flickerTimer = setInterval(() => {
          if (!this.active || this.phase !== "loop3" || window._paused) return;
          const a = $("art");
          if (a) {
            a.style.filter = Math.random() < 0.45 ? "brightness(0.28)" : "";
            setTimeout(() => { if (a) a.style.filter = ""; }, 180);
          }
          if (Math.random() < 0.4) {
            this.doorsOpen.living = !this.doorsOpen.living;
            this.doorsOpen.kitchen = !this.doorsOpen.kitchen;
            this.renderRoom();
          }
        }, 2400);
      } else if (n === 4) {
        Sfx.heartbeatStart();
        this.step = "door_siege";
        Walk.setTask("Петля 4/4: ОНО ЛОМИТСЯ ВО ВХОДНУЮ ДВЕРЬ! Готовься прятаться!", true);
        this.say("<p class='tremble'>19:41. БАМ! БАМ! БАМ! Входная дверь содрогается от чудовищных ударов! Замок трещит!</p>");
        let bangs = 0;
        this.sfxKnock(true);
        this.flickerTimer = setInterval(() => {
          if (!this.active || this.phase !== "loop4" || window._paused) return;
          bangs++;
          this.sfxKnock(true);
          document.body.classList.remove("shake");
          void document.body.offsetWidth;
          document.body.classList.add("shake");
          if (bangs >= 4) {
            clearInterval(this.flickerTimer);
            this.startHunt();
          }
        }, 1700);
      }
      this.renderRoom();
    },

    startHunt() {
      this.phase = "hunt";
      this.step = "survive";
      this.hiding = null;
      this.huntSecondsLeft = 45;
      writeSave({ ch2Stage: "hunt" });
      Sfx.heartbeatStart();
      this.sfxKnock(true);

      this.monster = { room: "corridor", target: "living", x: 160, alert: 0, left: 10 };

      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");

      if (Walk.hidden || $("walk").style.display === "none") this.enterRoom("bedroom", 200, 164);

      Walk.setTask("ВЫЖИВАЙ! Прячься в шкафах, под кроватью или за мебелью (клавиша E)!", true);
      this.say("<p class='end'>ВХОДНАЯ ДВЕРЬ ВЫЛОМАНА! Временная петля рухнула — существо вошло в квартиру и ищет тебя по комнатам!</p><p>Беги в любую комнату и нажми <b>E</b> возле укрытия. В каждой комнате оно задерживается на 10 секунд, и таймер виден вверху.</p>");
      this.renderRoom();

      clearInterval(this.huntTimer);
      clearInterval(this.monsterTick);

      this.huntSecondsLeft = 70;
      const showTask = () => {
        const left = Math.max(0, this.huntSecondsLeft);
        Walk.setTask(`ПРЯЧЬСЯ! Монстр: ${ROOM_NAMES[this.monster.room]}, ещё ${this.monster.left}с в комнате • До развязки: ${left}с`, true);
      };
      showTask();

      this.huntTimer = setInterval(() => {
        if (!this.active || this.phase !== "hunt" || window._paused) return;
        this.huntSecondsLeft--;
        showTask();
        if (this.huntSecondsLeft <= 0) {
          clearInterval(this.huntTimer);
          clearInterval(this.monsterTick);
          this.startEpilogue();
        }
      }, 1000);

      const route = ["corridor", "living", "corridor", "kitchen", "corridor", "bedroom", "corridor", "bathroom"];
      let rIdx = 0;
      this.monsterTick = setInterval(() => {
        if (!this.active || this.phase !== "hunt" || window._paused) return;
        const m = this.monster;

        if (m.room === this.room && !this.hiding) {
          this.caughtByMonster();
          return;
        }

        m.left--;
        if (m.left <= 0) {
          rIdx = (rIdx + 1) % route.length;
          m.room = route[rIdx];
          m.left = 10;
          this.doorsOpen[m.room] = true;
          this.sfxKnock(false);
          this.renderRoom();
          showTask();
          if (m.room === this.room && !this.hiding) {
            this.say("<p class='tremble'>ОНО ЗАШЛО В ЭТУ КОМНАТУ! БЫСТРО В УКРЫТИЕ (E)!</p>");
            setTimeout(() => {
              if (this.active && this.phase === "hunt" && this.monster.room === this.room && !this.hiding) this.caughtByMonster();
            }, 1150);
          } else if (m.room === this.room && this.hiding) {
            this.say(`<p class='blood'>Тяжёлые шаги совсем рядом! Монстр вошёл в комнату, а ты затаил дыхание (${this.hiding})...</p>`);
          }
        } else if (m.room === this.room) {
          if (this.hiding && m.left % 3 === 0) this.sfxKnock(false);
          this.renderRoom();
        }
        showTask();
      }, 1000);
    },

    openComputer() {
      if (document.querySelector(".game .ov")) return;
      const ov = document.createElement("div");
      ov.className = "ov";

      const isIntro = this.phase === "intro";
      const loopNum = this.phase.startsWith("loop") ? parseInt(this.phase.replace("loop", ""), 10) : 0;

      const videoTitle = isIntro
        ? "Тайны заброшенных лифтов и городские легенды — Выпуск #14"
        : loopNum === 1
          ? "Ночной стрим прохождения инди-хорроров (Запись)"
          : loopNum === 2
            ? "Помехи сигнала... [ОШИБКА СИНХРОНИЗАЦИИ 19:41]"

        </div>
      `;

              this.say("<p>Прошло 5 часов. На часах <b>19:41</b>. Из коридора слышен голос мамы: «Сынок, я на ночную смену, папа меня отвезёт и скоро вернётся! Закрой за нами дверь».</p>");

              this.step = "need_sleep";

              Walk.setTask(`Петля ${loopNum}/4: Подойди к кровати и нажми E, чтобы лечь спать (23:54)`, loopNum >= 2);
              this.say(`<p>На часах <b>23:54</b>. Видео закончилось. Подойди к кровати в своей комнате и нажми <b>E</b>, чтобы лечь спать.</p>`);
            }
          }
          if (pct >= 100) this.renderRoom();
        }, 550);
      };
    },

    getSpots() {
      const r = this.room;
      const out = [];
      const sp = (x, y, rr, l, run) => out.push({ x, y, r: rr, l, run });
      const toast = () => { Walk.toastMsg = "Сначала откройте дверь: кликните по ней ЛКМ"; Walk.toastT = performance.now() + 2200; };
      const door = (id, x, y, rr, l, go) => { if (this.doorOpen(id)) sp(x, y, rr, l, go); };

      if (this.hiding) {
        out.push({ x: Walk.x, y: Walk.y, r: 999, l: "вылезти из укрытия", run: () => this.toggleHide(this.hiding) });
        return out;

        s += `<g transform="translate(160 154) scale(1.15) translate(-185 -152)"><path d="M170 110 L150 152 M200 110 L220 152" stroke="#000" stroke-width="5" stroke-linecap="round"/><ellipse cx="185" cy="92" rx="12" ry="14" fill="#000"/><path d="M165 152 L170 105 Q185 98 200 105 L205 152Z" fill="#000"/><circle cx="180" cy="91" r="2.3" fill="#ff2e2e"/><circle cx="190" cy="91" r="2.3" fill="#ff2e2e"/></g>`;
      }
      if (isDark) s += rc(0, 0, 320, 180, "#000", 'opacity=".42"');
      else if (mood === "night") s += rc(0, 0, 320, 180, "#06081a", 'opacity=".22"');
      else if (mood === "dusk") s += rc(0, 0, 320, 180, "#ff9040", 'opacity=".07"');
      s += rc(0, 0, 320, 180, "url(#gV)");
      a.innerHTML = `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" pointer-events="none">${s}</svg>`;
    }

  };
  window.Ch2 = Ch2;
  $("art").addEventListener("click", e => {
    const g = e.target.closest && e.target.closest("[data-door]");
    if (!g || !Ch2.active || window._paused || document.querySelector(".game .ov")) return;
    Ch2.openDoor(g.getAttribute("data-door"));
  });

  const origSpotsNow = Walk.spotsNow.bind(Walk);
  Walk.spotsNow = function() {
    if (Ch2.active) return Ch2.getSpots();
    return origSpotsNow();
  };

  const origBounds = Walk.bounds.bind(Walk);
  Walk.bounds = function(id) {
    if (Ch2.active) {
      if (Ch2.room === "bathroom") return [66, 146, 246, 175];
      return [38, 146, 282, 175];
    }
    return origBounds(id);
  };

  const origGo = window.go;
  window.go = function(n) {
    if (n === "start" || n === "menu") {
      Ch2.stopAll();
      const d = $("disp");
      if (d) d.style.fontSize = "";
    }
    origGo(n);
  };
  Store.init();
})();

$("wk").innerHTML = artBase("__walker", 1);
Walk.apply();
updateSoundUI();
showWarning();
</script>
</body>
